# Every external input to the film. `python3 -m launchfilm.render --fetch` downloads
# each `url` into cache/sources/ (git-ignored). Rights were checked on each item's own
# page on the `accessed` date; `rights` quotes that page (or the collection's stated
# terms where the item page defers to them). Only real footage: no generated,
# procedural or CGI picture anywhere in the film.
#
# Optional keys:
#   segment: [start_s, end_s]  fetch only this window (re-encoded); cue sheet times stay
#                              in the ORIGINAL file's timeline.
#   active: [x0, y0, x1, y1]   usable picture area (fractions), excludes film borders.
#   ext:                       local file extension if the URL has none.

defaults:
  accessed: &acc "2026-09-28"
  dvids_rights: &dvids_rights >-
    DVIDS item page: "PUBLIC DOMAIN". "This work ... identified by DVIDS, must comply with
    the restrictions shown on https://www.dvidshub.net/about/copyright." Those terms: "In
    general, DoW VI that are works of authorship prepared by U.S. Government employees as
    part of their official duties are not eligible for copyright protection in the United
    States." Use must not imply DoD endorsement (notice on the end card); insignia, tail
    numbers and name tapes are cropped or blurred where they would read.
  nasa_rights: &nasa_rights >-
    NASA Image and Video Library, NASA media usage guidelines: "NASA content - images,
    audio, video, and computer files used in the rendition of 3-dimensional models ... -
    generally are not subject to copyright in the United States." Work of the U.S. federal
    government (17 U.S.C. 105). NASA logos/insignia not used; no endorsement implied.
  pexels_rights: &pexels_rights >-
    Pexels License (https://www.pexels.com/license/): "All photos and videos on Pexels can
    be downloaded and used for free." "Attribution is not required." Not allowed: selling
    unaltered copies, implying endorsement by identifiable people or brands shown, or
    redistributing on other stock platforms. Readable brand logos are cropped or blurred.

