    rights: >-
      The voice is Microsoft's. The free Edge Read Aloud endpoint that edge-tts calls is
      not licensed for commercial production; for a paid placement re-render the same
      voice and SSML through an Azure AI Speech resource (Speech service terms, "you own
      the output"), or replace the lines with a recorded read (narration_recorded/<id>.wav
      is picked up automatically). Narration is disclosed as synthetic in CREDITS.md.
